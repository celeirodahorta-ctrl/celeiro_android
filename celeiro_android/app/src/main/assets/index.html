const MONTHS=DATA.meses;
let section="horta";
let month=new Date().getMonth()+1;
let region=DATA.regioes[0]||"Portugal";
let query="";
const screen=document.getElementById("screen");

function products(){
  return section==="flores" ? (DATA.flores||[]) : section==="aromaticas" ? (DATA.aromaticas_medicinais||[]) : (DATA.produtos||[]);
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}
function img(url,name){
  return '<img class="photo" src="'+escapeHtml(url)+'" alt="'+escapeHtml(name)+'" loading="lazy" onerror="this.onerror=null;this.style.opacity=.25">';
}
function harvest(m,s,e){return s<=e ? m>=s&&m<=e : m>=s||m<=e;}

function lunarAdvice(p){
  const n=((p.nome||"")+" "+(p.grupo||"")).toLocaleLowerCase("pt-PT");
  const roots=["cenoura","beterraba","rabanete","nabo","nabo","batata","cebola","alho","chalota","cebolo","pastinaca","aipo","nabo"];
  const leafy=["alface","couve","couve-flor","brócolo","brocolo","acelga","espinafre","espinafre","rúcula","rucula","agrião","agriao","chicória","chicoria","endívia","endivia","nabiça","nabica","folha"];
  const fruit=["tomate","pimento","malagueta","beringela","pepino","courgette","abóbora","abobora","melão","melao","melancia","meloa","feijão","feijao","ervilha","fava","milho","girassol","morango","tomatillo"];
  if(roots.some(x=>n.includes(x))) return {phase:"Lua minguante",icon:"🌘",why:"tradicionalmente associada às culturas de raiz, bolbo e tubérculo."};
  if(leafy.some(x=>n.includes(x))) return {phase:"Lua minguante",icon:"🌘",why:"na tradição agrícola, favorece culturas de folha e ajuda a limitar o espigamento."};
  if(fruit.some(x=>n.includes(x))) return {phase:"Lua crescente",icon:"🌒",why:"tradicionalmente associada às plantas que produzem frutos e crescem acima do solo."};
  if(section==="flores") return {phase:"Lua crescente",icon:"🌒",why:"tradicionalmente associada ao desenvolvimento da parte aérea e à floração."};
  if(section==="aromaticas") return {phase:"Lua crescente",icon:"🌒",why:"referência tradicional para plantas aromáticas que desenvolvem folhas e parte aérea."};
  return {phase:"Lua crescente",icon:"🌒",why:"referência tradicional para sementeiras de plantas que crescem acima do solo."};
}

function filtered(){
  const q=query.trim().toLocaleLowerCase("pt-PT");
  return products().filter(p=>{
    const text=(p.nome+" "+(p.referencia||"")).toLocaleLowerCase("pt-PT");
    if(q && !text.includes(q)) return false;
    if(section==="flores") return true;

    const sow = Array.isArray(p.sow)
      ? p.sow.map(Number)
      : String(p.sow || "").split(/[;,\s]+/).filter(Boolean).map(Number);
    const transplant = Array.isArray(p.transplant)
      ? p.transplant.map(Number)
      : String(p.transplant || "").split(/[;,\s]+/).filter(Boolean).map(Number);

    const sowMatch=sow.includes(month);
    const transplantMatch=transplant.includes(month);
    const hs=Number(p.harvestStart), he=Number(p.harvestEnd);
    const harvestMatch=Number.isFinite(hs)&&Number.isFinite(he)
      ? harvest(month,hs,he) : false;

    return sowMatch || transplantMatch || harvestMatch;
  });
}

  return '<label>Secção</label><select id="sectionSelect" aria-label="Escolher secção">'+

    '<option value="aromaticas">🌿 Aromáticas e Medicinais</option>'+
    '<option value="pragas">🐞 Doenças, Fungos e Insetos</option>'+
    '</select>';
}
function regionSelector(){
  return '<label>Região de Portugal</label><select id="regionSelect">'+
    DATA.regioes.map(r=>'<option>'+escapeHtml(r)+'</option>').join('')+
    '</select>';
}
function bindCommon(){
  const s=document.getElementById("sectionSelect");
  if(s){s.value=section;s.onchange=e=>{section=e.target.value;query="";section==="pragas"?pestsPage():calendarPage();};}
  const r=document.getElementById("regionSelect");
  if(r){r.value=region;r.onchange=e=>{region=e.target.value;renderCards();};}
  const q=document.getElementById("searchInput");
  if(q){q.value=query;q.oninput=e=>{query=e.target.value;renderCards();};}
}

function renderCards(){
  const arr=filtered();
  const count=document.getElementById("count"),cards=document.getElementById("cards");
  if(!count||!cards)return;
  count.textContent=arr.length+" "+(section==="flores"?"flores":section==="aromaticas"?"plantas":"produtos");
  if(!arr.length){cards.innerHTML='<div class="empty">🌱 Não foram encontrados artigos.</div>';return;}
  cards.innerHTML=arr.map(p=>{
    const moon=lunarAdvice(p);
    const sowLabel=(Number.isFinite(Number(p.sow))&&Number(p.sow)>=1&&Number(p.sow)<=12)
      ? MONTHS[Number(p.sow)-1] : 'Consultar época';
    const plantLabel=(Number.isFinite(Number(p.transplant))&&Number(p.transplant)>=1&&Number(p.transplant)<=12)
      ? MONTHS[Number(p.transplant)-1] : 'Consultar época';
    const tags=section==="flores"
      ? '<span class="tag pink">🌼 Flores e Jardim</span><span class="tag green">🌱 Sementeira: consultar época</span><span class="tag yellow">🌿 Plantio: consultar época</span><span class="tag yellow">'+moon.icon+' '+moon.phase+'</span>'
      : section==="aromaticas"
        ? '<span class="tag green">🌿 Aromáticas e Medicinais</span><span class="tag yellow">🌱 Sementeira: '+sowLabel+'</span><span class="tag yellow">🌿 Plantio: '+plantLabel+'</span><span class="tag yellow">'+moon.icon+' '+moon.phase+'</span>'
        : '<span class="tag green">🌱 '+MONTHS[p.sow-1]+'</span><span class="tag yellow">🌿 '+MONTHS[p.transplant-1]+'</span><span class="tag yellow">'+moon.icon+' '+moon.phase+'</span>';
    return '<article class="card" data-id="'+escapeHtml(p.id)+'">'+img(p.imagem,p.nome)+'<div class="name">'+escapeHtml(p.nome)+'</div><div class="ref">'+escapeHtml(p.referencia||"")+'</div>'+tags+'</article>';
  }).join("");
  cards.querySelectorAll(".card").forEach(c=>c.onclick=()=>detailPage(c.dataset.id));
}

const LUNAR_MONTHS=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function moonPhaseEvents(year){
  // Synodic month approximation using the well-established Meeus phase formula.
  const k0=Math.floor((year-2000)*12.3685);
  const phases=[];
  function jde(k,phase){
    const T=k/1236.85, T2=T*T, T3=T2*T, T4=T3*T;
    let J=2451550.09765+29.530588853*k+0.0001337*T2-0.000000150*T3+0.00000000073*T4;
    const E=1-0.002516*T-0.0000074*T2;
    const M=(2.5534+29.10535670*k-0.0000014*T2-0.00000011*T3)*Math.PI/180;
    const Mp=(201.5643+385.81693528*k+0.0107582*T2+0.00001238*T3-0.000000058*T4)*Math.PI/180;
    const F=(160.7108+390.67050284*k-0.0016118*T2-0.00000227*T3+0.000000011*T4)*Math.PI/180;
    const Om=(124.7746-1.56375580*k+0.0020672*T2+0.00000215*T3)*Math.PI/180;
    const sr=x=>Math.sin(x), cr=x=>Math.cos(x);
    let corr=0;
    if(phase===0){
      corr=-0.40720*sr(Mp)+0.17241*E*sr(M)+0.01608*sr(2*Mp)+0.01039*sr(2*F)+0.00739*E*sr(Mp-M)-0.00514*E*sr(Mp+M)+0.00208*E*E*sr(2*M)-0.00111*sr(Mp-2*F)-0.00057*sr(Mp+2*F)+0.00056*E*sr(2*Mp+M)-0.00042*sr(3*Mp)+0.00042*E*sr(M+2*F)+0.00038*E*sr(M-2*F)-0.00024*E*sr(2*Mp-M)-0.00017*sr(Om)-0.00007*sr(Mp+2*M)+0.00004*sr(2*Mp-2*F)+0.00004*sr(3*M)+0.00003*sr(Mp+M-2*F)+0.00003*sr(2*Mp+2*F)-0.00003*sr(Mp+M+2*F)+0.00003*sr(Mp-M+2*F)-0.00002*sr(Mp-M-2*F)-0.00002*sr(3*Mp+M)+0.00002*sr(4*Mp);
    } else if(phase===0.5){
      corr=-0.62801*sr(Mp)+0.17172*E*sr(M)-0.01183*E*sr(Mp+M)+0.00862*sr(2*Mp)+0.00804*sr(2*F)+0.00454*E*sr(Mp-M)+0.00204*E*E*sr(2*M)-0.00180*sr(Mp-2*F)-0.00070*sr(Mp+2*F)-0.00040*sr(3*Mp)-0.00034*E*sr(2*Mp-M)+0.00032*E*sr(M+2*F)+0.00032*E*sr(M-2*F)-0.00028*E*E*sr(Mp+2*M)+0.00027*E*sr(2*Mp+M)-0.00017*sr(Om)-0.00005*sr(Mp-M-2*F)+0.00004*sr(2*Mp+2*F)-0.00004*sr(3*M)+0.00003*sr(Mp+M-2*F)+0.00003*sr(2*Mp-M-2*F)+0.00003*sr(Mp+M+2*F)-0.00002*sr(Mp-M+2*F)-0.00002*sr(3*Mp+M)+0.00002*sr(4*Mp);
      corr += 0.0028-0.0004*cr(M)+0.0003*cr(Mp);
    } else if(phase===1){
      corr=0.40614*sr(Mp)+0.17302*E*sr(M)+0.01614*sr(2*Mp)+0.01043*sr(2*F)+0.00734*E*sr(Mp-M)-0.00515*E*sr(Mp+M)+0.00209*E*E*sr(2*M)-0.00111*sr(Mp-2*F)-0.00057*sr(Mp+2*F)+0.00056*E*sr(2*Mp+M)-0.00042*sr(3*Mp)+0.00042*E*sr(M+2*F)+0.00038*E*sr(M-2*F)-0.00024*E*sr(2*Mp-M)-0.00017*sr(Om)-0.00007*sr(Mp+2*M)+0.00004*sr(2*Mp-2*F)+0.00004*sr(3*M)+0.00003*sr(Mp+M-2*F)+0.00003*sr(2*Mp+2*F)-0.00003*sr(Mp+M+2*F)+0.00003*sr(Mp-M+2*F)-0.00002*sr(Mp-M-2*F)-0.00002*sr(3*Mp+M)+0.00002*sr(4*Mp);
    } else {
      corr=0.66752*sr(Mp)+0.17172*E*sr(M)+0.00862*sr(2*Mp)+0.00804*sr(2*F)+0.00454*E*sr(Mp-M)-0.00204*E*E*sr(2*M)+0.00180*sr(Mp-2*F)+0.00070*sr(Mp+2*F)+0.00040*sr(3*Mp)-0.00034*E*sr(2*Mp-M)+0.00032*E*sr(M+2*F)+0.00032*E*sr(M-2*F)-0.00028*E*E*sr(Mp+2*M)+0.00027*E*sr(2*Mp+M)-0.00017*sr(Om)-0.00005*sr(Mp-M-2*F)+0.00004*sr(2*Mp+2*F)-0.00004*sr(3*M)+0.00003*sr(Mp+M-2*F)+0.00003*sr(2*Mp-M-2*F)+0.00003*sr(Mp+M+2*F)-0.00002*sr(Mp-M+2*F)-0.00002*sr(3*Mp+M)+0.00002*sr(4*Mp);
    }
    return J+corr;
  }
  function jdToDate(jd){
    return new Date((jd-2440587.5)*86400000);
  }
  for(let k=k0-2;k<=k0+14;k++){
    const yearFraction=k/12.3685;
    const baseYear=2000+yearFraction;
    const approxYear=Math.floor(baseYear);
    if(approxYear<year-1||approxYear>year+1) continue;
    [[0,"🌑","Lua nova"],[0.25,"🌓","Quarto crescente"],[0.5,"🌕","Lua cheia"],[0.75,"🌗","Quarto minguante"]].forEach(([ph,icon,name])=>{
      const d=jdToDate(jde(k+ph,ph));
      if(d.getUTCFullYear()===year) phases.push({date:d,icon,name,month:d.getUTCMonth()});
    });
  }
  phases.sort((a,b)=>a.date-b.date);
  return phases;
}
function lunarSowingTip(monthIndex){
  const names=["raízes e tubérculos","folhas e ervas","frutos e plantas que crescem acima do solo","flores e plantas de desenvolvimento aéreo"];
  return monthIndex%2===0 ? "Lua crescente: tradicionalmente usada para culturas de fruto, folhas e desenvolvimento acima do solo." : "Lua minguante: tradicionalmente usada para raízes, bolbos e tubérculos.";
}
function lunarCalendarPage(){
  setHomeMode(false);
  const year=new Date().getFullYear();
  const phases=moonPhaseEvents(year);
  const groups=LUNAR_MONTHS.map((name,i)=>({name,index:i,events:phases.filter(x=>x.month===i)}));
  screen.innerHTML=
    '<button class="btn back" id="backFromLunar">← Voltar</button>'+
    '<div class="lunar-calendar">'+
      '<section class="lunar-head"><h2>🌙 Calendário Lunar</h2><p>Fases da Lua para o ano corrente, calculadas automaticamente. O calendário acompanha o ano do dispositivo.</p><div class="lunar-year"><strong>'+year+'</strong><span>🇵🇹 Horário de referência: Portugal continental</span></div></section>'+
      '<div class="lunar-months">'+
      groups.map(g=>'<article class="lunar-month"><h3>'+g.name+'</h3>'+
        (g.events.length?g.events.map(e=>'<div class="lunar-event"><span class="mi">'+e.icon+'</span><span><b>'+e.name+'</b><br>'+e.date.toLocaleDateString("pt-PT",{day:"2-digit",month:"2-digit"})+' — '+e.date.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})+'</span></div>').join(""):'<div class="lunar-event">Sem mudança de fase principal este mês.</div>')+
        '<div class="lunar-seed">🌱 <b>Sementeira tradicional:</b> '+lunarSowingTip(g.index)+'</div>'+
      '</article>').join("")+
      '</div>'+
      '<div class="lunar-legend"><b>Importante:</b> as recomendações de sementeira pela Lua pertencem à tradição agrícola e não substituem temperatura, humidade, solo, época da cultura ou condições meteorológicas. As datas das fases lunares são astronómicas e atualizadas automaticamente para o ano corrente.</div>'+
    '</div>';
  document.getElementById("backFromLunar").onclick=homePage;
}

        '<div class="row"><b>🌿 Plantio</b><p>Quando aplicável, plantar ou transplantar após a fase inicial de desenvolvimento, respeitando a época indicada para a espécie e as condições locais.</p></div>'+

          '<div class="row"><b>☀️ Exposição</b><p>'+escapeHtml(p.light)+'</p></div>'+
          '<div class="row"><b>💧 Cuidados</b><p>'+escapeHtml(p.care)+'</p></div>'+
          '<div class="row"><b>🐛 Pragas e problemas</b><p>'+escapeHtml(p.problems)+'</p></div>'+

      : '<div class="row"><b>☀️ Exposição</b><p>'+escapeHtml(p.light)+'</p></div>'+
        '<div class="row"><b>💧 Cuidados</b><p>'+escapeHtml(p.care)+'</p></div>'+
        '<div class="row"><b>🐛 Pragas e problemas</b><p>'+escapeHtml(p.problems)+'</p></div>'+
        '<div class="row"><b>📅 Calendário</b><p>Semear: '+MONTHS[p.sow-1]+' · Plantar: '+MONTHS[p.transplant-1]+' · Colheita: '+MONTHS[p.harvestStart-1]+' a '+MONTHS[p.harvestEnd-1]+'</p></div>'
    )+
